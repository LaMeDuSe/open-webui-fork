name: Build

on:
  workflow_call:

  push:
    branches: [main]

  pull_request:
    branches: [main]

  release:
    types: [published]

  workflow_dispatch:

jobs:
  build-push-docker:
    uses: lameduse/actions/.github/workflows/build-push-docker.yaml@main
    secrets: inherit
    with:
      DIRECTORIES: '["."]'

  status-check:
    name: Build
    runs-on: ubuntu-24.04
    needs:
      - build-push-docker
    if: success()
    steps:
      - name: Final status check
        run: echo "All builds succeeded"
