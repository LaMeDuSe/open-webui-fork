name: Release

on:
  workflow_dispatch:

jobs:
  check_perms:
    runs-on: lameduse-runners
    steps:
      - name: Check if Actor is a Member of one of the teams
        uses: im-open/is-actor-team-member@v1.2.1
        with:
          github-actor: ${{ github.actor }}
          github-organization: lameduse
          github-team-slugs: |
            [
              "developers"
            ]
          github-token: ${{ secrets.LAMEDUSE_TOKEN }}

  build:
    if: github.ref == 'refs/heads/main'
    needs:
      - check_perms
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  perfom-release:
    if: github.ref == 'refs/heads/main'
    needs:
      - check_perms
      - build
    runs-on: lameduse-runners
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.LAMEDUSE_TOKEN }}
          fetch-depth: 0

      - name: Release project
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          branch: main
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/npm
        env:
          GITHUB_TOKEN: ${{ secrets.LAMEDUSE_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.LAMEDUSE_BOT_GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LAMEDUSE_BOT_GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LAMEDUSE_BOT_GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LAMEDUSE_BOT_GIT_COMMITTER_EMAIL }}
